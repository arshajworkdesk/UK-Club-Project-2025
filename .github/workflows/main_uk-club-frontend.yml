# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Uk-Club-Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Angular CLI
        run: npm install -g @angular/cli@16

      - name: npm install and build
        working-directory: Front-end
        run: |
          npm install
          npm run build -- --configuration production

      - name: Create package.json for Azure
        working-directory: Front-end/dist/uk-club-frontend
        run: |
          echo '{"name":"uk-club-frontend","version":"1.0.0","scripts":{"start":"node server.js"},"dependencies":{"express":"^4.18.2"}}' > package.json

      - name: Create server.js for Azure
        working-directory: Front-end/dist/uk-club-frontend
        run: |
          cat > server.js << 'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const port = process.env.PORT || 8080;
          
          app.use(express.static(__dirname));
          
          app.get('*', (req, res) => {
            res.sendFile(path.join(__dirname, 'index.html'));
          });
          
          app.listen(port, () => {
            console.log(`Server running on port ${port}`);
          });
          EOF

      - name: Install Express for Azure deployment
        working-directory: Front-end/dist/uk-club-frontend
        run: |
          npm install express --save --production

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Front-end/dist/uk-club-frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy
      
      - name: List downloaded files
        run: ls -la deploy/
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73E8ABCAC5444C2F90F2810342838AE2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5EDE73634F544B0B31634B48F9DA90F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4FD6CAE72E63422D9F29E52062979FEA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Uk-Club-Frontend'
          slot-name: 'Production'
          package: deploy
          