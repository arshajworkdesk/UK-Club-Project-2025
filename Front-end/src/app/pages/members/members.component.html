<div class="members-container">
  <div class="members-header">
    <h1 class="page-title">{{ APP_MESSAGES.UI.MEMBERS_TITLE }}</h1>
    <p class="page-subtitle">{{ getMembersSubtitle() }}</p>
  </div>

  <div class="members-controls">
    <div class="search-box">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
        [placeholder]="APP_MESSAGES.UI.SEARCH_MEMBERS"
        class="search-input"
      />
      <span class="search-icon">🔍</span>
    </div>
    
    <div class="sort-controls">
      <label for="sortBy">
        <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M7 12h10M10 18h4"/>
        </svg>
        {{ APP_MESSAGES.UI.MEMBERS_SORT.LABEL }}
      </label>
      <select id="sortBy" [(ngModel)]="sortBy" (change)="onSortChange()" class="sort-select">
        <option value="name">{{ APP_MESSAGES.UI.MEMBERS_SORT.NAME }}</option>
        <option value="email">{{ APP_MESSAGES.UI.MEMBERS_SORT.EMAIL }}</option>
      </select>
    </div>
  </div>

  <div class="members-content">
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>{{ APP_MESSAGES.UI.LOADING_MEMBERS }}</p>
    </div>

    <div *ngIf="!isLoading && filteredMembers.length === 0" class="empty-state">
      <p>{{ APP_MESSAGES.UI.NO_MEMBERS_FOUND }}</p>
    </div>

    <div *ngIf="!isLoading && filteredMembers.length > 0" class="members-grid" [@staggerList]>
      <div class="member-card" *ngFor="let member of filteredMembers" [@fadeIn]>
        <div class="member-avatar">
          <img 
            *ngIf="member.profilePictureUrl || member.profilePicture" 
            [src]="getImageUrl(member.profilePictureUrl || member.profilePicture)" 
            [alt]="getProfilePictureAlt(member.fullName)"
            class="member-profile-image"
            (error)="onImageError($event)"
          />
          <span *ngIf="!member.profilePictureUrl && !member.profilePicture" class="member-initial">
            {{ member.fullName.charAt(0) }}
          </span>
        </div>
        <div class="member-info">
          <h3 class="member-name">{{ member.fullName }}</h3>
          <p class="member-email">{{ member.email }}</p>
          <div class="member-meta" *ngIf="member.role">
            <span class="role-badge" [class.role-admin]="member.role === 'admin'" [class.role-manager]="member.role === 'manager'" [class.role-member]="member.role === 'member'">
              {{ formatRole(member.role) }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && filteredMembers.length > 0" class="members-stats">
    <p>{{ getShowingMembersMessage() }}</p>
  </div>
</div>
